<!doctype html>
<html lang="en" class="fluent">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EMT TentCare</title>
<meta name="description" content="EMT TentCare: offline-first patient flow for a six-tent emergency field hospital. Demo with fictional data.">
<meta name="theme-color" content="#0f6cbd">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TentCare">
<style>
:root{
  --bg:#f6f0e7; --surface:#fffdf9; --surface-2:#f1e9dc; --line:#e4d9c7;
  --text:#13263a; --muted:#5d6a78; --primary:#113a60; --primary-ink:#ffffff; --primary-soft:#e3eaf2;
  --accent:#00a8a8; --accent-ink:#007d7d; --accent-soft:#d9f2f0;
  --red:#d0342c; --red-soft:#fbe6e3; --amber:#b97100; --amber-soft:#fcefd6; --green:#1f7a3f; --green-soft:#ddf1e3;
  --radius:14px; --shadow:0 1px 2px rgba(17,58,96,.05),0 2px 8px rgba(17,58,96,.06);
  --nav-h:0px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary);text-underline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:16px;height:16px}

/* top bar */
.top{background:var(--primary);color:var(--primary-ink);position:sticky;top:0;z-index:20;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.3px}
.brand .mark{width:54px;height:42px;border-radius:10px;background:var(--bg);display:grid;place-items:center;flex:none}
.brand .mark img{width:46px;height:auto;display:block}
.brand .bname{display:flex;flex-direction:column;line-height:1.1}
.brand .bname small{font-weight:600;font-size:10.5px;letter-spacing:1.6px;opacity:.75;text-transform:uppercase}
.top .spacer{flex:1}
.who{font-size:13px;text-align:right;line-height:1.2}
.who .role{opacity:.75}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:999px;font-weight:600;white-space:nowrap}
.pill.on{background:rgba(255,255,255,.12)}
.pill.on .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.pill.off{background:#fff;color:var(--red)}
.pill.off .dot{width:7px;height:7px;border-radius:50%;background:var(--red)}
.iconbtn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;border:0;background:rgba(255,255,255,.1);color:#fff;cursor:pointer}
.iconbtn:hover{background:rgba(255,255,255,.18)}

/* navigation: top tabs on wide screens, bottom bar on phones */
.nav{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:60px;z-index:19}
.nav .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav .wrap::-webkit-scrollbar{display:none}
.nav button{display:flex;align-items:center;gap:8px;background:none;border:0;padding:13px 12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
.nav button .ic{color:var(--accent)}
.nav button.active{color:var(--primary);border-bottom-color:var(--accent)}
.nav .count{display:inline-block;min-width:20px;padding:1px 6px;border-radius:999px;background:var(--surface-2);font-size:11.5px;color:var(--text);text-align:center}
.nav button.active .count{background:var(--accent-soft);color:var(--accent-ink)}

main{padding:22px 0 60px}
h1{font-size:23px;margin:0 0 4px;color:var(--primary);letter-spacing:-.2px}
h2{font-size:16px;margin:0 0 12px;color:var(--primary)}
h3{font-size:14px;margin:0 0 8px;color:var(--primary)}
.sub{color:var(--muted);margin:0 0 18px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:720px){.g3{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.small{font-size:13px}
.mt{margin-top:16px}
.empty{padding:26px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius);background:var(--surface)}
.empty img{width:84px;opacity:.55;display:block;margin:0 auto 8px}
.secthead{display:flex;align-items:center;gap:8px;margin:0 0 12px}
.secthead .ic{color:var(--accent)}
.secthead h2{margin:0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;font-weight:600;cursor:pointer;min-height:42px;color:var(--primary)}
.btn .ic{color:var(--accent)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary .ic{color:#7fe0de}
.btn.primary:hover{background:#0d2f4f}
.btn.danger{color:var(--red);border-color:#efc3bd}
.btn.danger .ic{color:var(--red)}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* tiles */
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow)}
.tile .tic{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.tile .n{font-size:26px;font-weight:800;line-height:1.05;color:var(--primary)}
.tile .l{color:var(--muted);font-size:12.5px;line-height:1.3}
.tile.red .tic{background:var(--red-soft);color:var(--red)}
.tile.red .n{color:var(--red)}
.tile.amber .tic{background:var(--amber-soft);color:var(--amber)}
.tile.amber .n{color:var(--amber)}

/* triage */
.tri{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.4px}
.tri::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.tri.red{color:var(--red);background:var(--red-soft)}
.tri.yellow{color:var(--amber);background:var(--amber-soft)}
.tri.green{color:var(--green);background:var(--green-soft)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:7px;background:var(--surface-2);color:var(--muted)}
.badge.warn{background:var(--amber-soft);color:var(--amber)}
.badge.ok{background:var(--green-soft);color:var(--green)}
.badge.info{background:var(--accent-soft);color:var(--accent-ink)}

/* patient list */
.plist{display:grid;gap:10px}
.pcard{display:flex;gap:12px;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px 12px 0;cursor:pointer;text-align:left;width:100%;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.pcard:hover{border-color:#c9b99f;transform:translateY(-1px)}
.pcard .bar{width:5px;border-radius:0 4px 4px 0;flex:none}
.pcard .bar.red{background:var(--red)} .pcard .bar.yellow{background:var(--amber)} .pcard .bar.green{background:var(--green)} .pcard .bar.none{background:var(--line)}
.pcard .main{flex:1;min-width:0}
.pcard .name{font-weight:700;color:var(--primary)}
.pcard .meta{color:var(--muted);font-size:13px}
.pcard .cc{margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .side{text-align:right;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.pcard .side .wait{display:inline-flex;align-items:center;gap:4px}
.pcard .side .wait .ic{color:var(--accent)}

/* tent bars */
.tentrow{display:grid;grid-template-columns:36px 140px 1fr 56px;gap:10px;align-items:center;padding:8px 0;cursor:pointer;border-bottom:1px solid var(--surface-2)}
.tentrow:last-of-type{border-bottom:0}
.tentrow .num{width:32px;height:32px;border-radius:9px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:800;font-size:13px}
.track{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden;display:flex}
.track span{display:block;height:100%}
.track .w{background:#9ad9d8} .track .c{background:var(--accent)}
.legend{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* ward */
.beds{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.bed{min-width:0;border:1px solid var(--line);border-radius:11px;padding:8px;min-height:66px;background:var(--surface);text-align:left;cursor:default;font-size:12px}
.bed .num{font-weight:700;font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:space-between}
.bed.occ{cursor:pointer;background:var(--primary);border-color:var(--primary);color:#fff}
.bed.occ .num{color:rgba(255,255,255,.7)}
.bed.occ .who{color:#fff;font-weight:600;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;font-size:12px}
.bed .who{text-align:left}
.bed.free .who{color:var(--accent-ink);font-weight:600;margin-top:4px}
.bed .tdot{width:9px;height:9px;border-radius:50%;display:inline-block;box-shadow:0 0 0 2px rgba(255,255,255,.6)}
.tdot.red{background:#ff6b5e} .tdot.yellow{background:#ffc04d} .tdot.green{background:#5fd18a}

/* forms */
label{display:block;font-size:13px;font-weight:600;margin:0 0 5px;color:var(--muted)}
input[type=text],input[type=number],input[type=password],input[type=tel],select,textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff;min-height:44px}
textarea{min-height:88px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:3px solid var(--accent-soft);border-color:var(--accent)}
.field{margin-bottom:12px}
.fgrid{display:grid;gap:0 12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.choice{display:flex;gap:8px;flex-wrap:wrap}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice label{margin:0;border:1px solid var(--line);border-radius:11px;padding:9px 14px;cursor:pointer;color:var(--text);background:#fff;font-weight:600}
.choice input:checked+label{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.choice input:focus-visible+label{outline:3px solid var(--accent-soft)}
.choice.tri-pick input:checked+label.r{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.choice.tri-pick input:checked+label.y{border-color:var(--amber);background:var(--amber-soft);color:var(--amber)}
.choice.tri-pick input:checked+label.g{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.formsec{display:flex;align-items:center;gap:8px;margin:18px 0 10px}
.formsec:first-child{margin-top:0}
.formsec .ic{color:var(--accent)}
.formsec h2{margin:0}

/* patient header */
.phead{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;justify-content:space-between}
.phead h1{margin-bottom:2px}
.mrnline{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:var(--accent-ink);font-weight:700;letter-spacing:.5px}
.where{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--primary)}
.where .ic{color:var(--accent)}
.vitals{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.vitals div{background:var(--surface-2);border-radius:11px;padding:9px 11px}
.vitals b{display:block;font-size:16px;color:var(--primary)}
.vitals span{font-size:12px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{position:relative;padding:0 0 14px 22px;border-left:2px solid var(--line);margin-left:6px}
.timeline li:last-child{border-left-color:transparent}
.timeline li::before{content:"";position:absolute;left:-7px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.timeline .t{font-size:12px;color:var(--muted)}
.note{border-left:3px solid var(--accent);padding:6px 0 6px 12px;margin-bottom:12px;background:linear-gradient(90deg,var(--accent-soft),transparent 60%);border-radius:0 8px 8px 0}
.order{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--surface-2)}
.order:last-child{border-bottom:0}

/* login */
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 16px;background:var(--bg)}
.login .logo{width:min(300px,78vw);height:auto;display:block;margin:0 auto 18px}
.login .box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;width:100%;max-width:440px;box-shadow:0 10px 30px rgba(17,58,96,.10)}
.login .lead{color:var(--muted);margin:0 0 16px;text-align:center}
.pick-h{font-size:17px;margin:0 0 8px;text-align:center}
.accounts .short,.howto-m{display:none}
.disclaimer summary{cursor:pointer;font-weight:600;color:var(--text);text-align:center;list-style:none}
.disclaimer summary::-webkit-details-marker{display:none}
.disclaimer summary::after{content:' ▾'}
.disclaimer[open] summary{margin-bottom:8px}
.disclaimer p{margin:0 0 8px}
.howto{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:6px;font-size:13.5px;color:var(--text)}
.howto li{display:flex;gap:10px;align-items:flex-start}
.howto li>b{flex:none;width:22px;height:22px;border-radius:50%;background:var(--primary);color:#fff;font-size:12px;display:grid;place-items:center;margin-top:1px}
.only-mouse{display:none}
@media(hover:hover) and (pointer:fine){.only-mouse{display:inline}.only-touch{display:none}}
.accounts{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
.accounts button:last-child:nth-child(odd){grid-column:1/-1}
.accounts button{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;width:100%;min-height:44px;text-align:left;background:var(--surface-2);border:2px solid transparent;border-radius:12px;padding:12px;cursor:pointer;font:inherit;color:inherit}
.accounts .atext{display:flex;flex-direction:column;gap:2px}
.accounts .try{font-size:12px;color:var(--muted);line-height:1.35;margin-top:2px}
.accounts .tick{position:absolute;top:8px;right:10px;width:20px;height:20px;border-radius:50%;background:var(--primary);color:#fff;font-size:12px;display:none;place-items:center}
.accounts button.on{border-color:var(--primary)}
.accounts button.on .tick{display:grid}
.accounts button:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.accounts button:hover{border-color:var(--line);background:#ece2d2}
.accounts .aic{width:34px;height:34px;border-radius:10px;background:var(--surface);color:var(--accent);display:grid;place-items:center;flex:none}
.accounts .atext{flex:1;min-width:0}
.accounts .atext b{color:var(--primary)}
.disclaimer{font-size:12px;color:var(--muted);margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.err{color:var(--red);font-size:13px;margin:4px 0 10px;min-height:18px}
.offline-note{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--muted);font-size:12.5px;margin-top:14px}
.offline-note .ic{color:var(--accent)}
.err-box{background:var(--red-soft);color:var(--red);border-radius:6px;padding:9px 12px;font-size:13.5px;margin:6px 0 10px;line-height:1.5}
.warn-box{background:var(--amber-soft);color:var(--amber);border-radius:6px;padding:9px 12px;font-size:13.5px;margin:6px 0 10px;line-height:1.5}
.infobar{display:flex;align-items:center;gap:8px;background:var(--amber-soft);color:var(--amber);border-radius:6px;padding:9px 12px;font-weight:600;font-size:14px;margin-top:12px}
.dupe{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.visitline{font-size:12.5px;color:var(--muted);margin-top:2px}
.prev{padding:9px 0;border-bottom:1px solid var(--surface-2)}
.prev:last-child{border-bottom:0}
.bed.occ.res,.fluent .bed.occ.res{background:#ebf3fc;border:2px dashed #0f6cbd;color:#0f6cbd}
.bed.occ.res .num,.bed.occ.res .who{color:#0f6cbd}
.bed.clean{background:var(--amber-soft);border-color:#e8c98a}
.bed.clean .who{color:var(--amber);font-weight:600;margin-top:4px}
.bed.clean button{margin-top:6px;font-size:11.5px;padding:3px 8px;border-radius:4px;border:1px solid #e8c98a;background:#fff;color:var(--amber);cursor:pointer}
.legend-row{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:0 0 12px}
.legend-row i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px;border:1px solid var(--line)}
.sec-h{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--primary);margin:16px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.abcde{display:grid;grid-template-columns:90px 70px 1fr 1fr;gap:6px;align-items:center;margin-bottom:6px}
.abcde b{font-size:13px}
.abcde input[type=text]{min-height:36px}
.checks label{display:flex;gap:10px;align-items:flex-start;font-weight:400;color:var(--text);margin:0 0 8px;font-size:14px}
.checks input[type=checkbox]{width:18px;height:18px;flex:none;margin-top:2px;accent-color:var(--primary)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.steps span{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.steps span.done{background:var(--green-soft);color:var(--green);font-weight:600}
.refprint h3{margin:12px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.5px}
.refprint table{width:100%;border-collapse:collapse;font-size:12.5px}
.refprint td{border:1px solid #bbb;padding:4px 6px;vertical-align:top}
.refprint td:first-child{width:32%;font-weight:600;background:#f5f5f5}
@media(max-width:720px){.abcde{grid-template-columns:1fr auto;padding-bottom:8px;border-bottom:1px solid var(--line)}.abcde input[type=text]{grid-column:1 / -1}}
.abcde .checkline{white-space:nowrap}
.tri.black{color:#fff;background:#242424}
.pcard .bar.black{background:#242424}
.tdot.black{background:#242424}
.choice.tri-pick input:checked+label.k{border-color:#242424;background:#242424;color:#fff}
details.crit{border:1px solid var(--line);border-radius:6px;padding:0 12px;margin:4px 0 12px;background:var(--surface)}
details.crit summary{cursor:pointer;padding:10px 0;font-weight:600;font-size:14px;list-style:none;display:flex;gap:8px;align-items:center}
details.crit summary::-webkit-details-marker{display:none}
details.crit summary::before{content:'▸';color:var(--muted);transition:transform .15s}
details.crit[open] summary::before{transform:rotate(90deg)}
details.crit summary .cnt{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted)}
.critcols{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;padding-bottom:10px}
.mdstbl{width:100%;border-collapse:collapse;font-size:13px}
.mdstbl th,.mdstbl td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:right}
.mdstbl th:first-child,.mdstbl td:first-child,.mdstbl th:nth-child(2),.mdstbl td:nth-child(2){text-align:left}
.mdstbl td:first-child{color:var(--muted);width:34px}
.mdstbl tr.grp td{background:var(--surface);font-weight:600;text-align:left;color:var(--text);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.mdstbl td.z{color:var(--muted)}
.mdstbl .tot{font-weight:600}
.mdswrap{overflow-x:auto}
.mdswrap .mdstbl{min-width:600px}
.critcols h4{margin:10px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.critcols h3{margin:6px 0 0;font-size:13.5px}
@media(max-width:720px){.critcols{grid-template-columns:1fr}}
.tri-hint{font-size:13.5px;font-weight:600;padding:8px 12px;border-radius:6px;margin:0 0 10px;display:none}
.tri-hint.red{display:block;background:var(--red-soft);color:var(--red)}

html.fluent{

  --text:#242424; --muted:#616161; --primary:#0f6cbd; --primary-ink:#ffffff; --primary-soft:#ebf3fc;

function seedAttendance() {
  const rec = {};
  const plan = { 'ST-05': ['late', 35], 'ST-06': ['absent'], 'ST-14': ['absent'], 'ST-21': ['leave'], 'ST-23': ['late', 50] };
  S.staff.forEach((st, i) => {
    const p = plan[st.id];
    if (p && p[0] === 'absent') rec[st.id] = { status: 'absent' };
    else if (p && p[0] === 'leave') rec[st.id] = { status: 'leave' };
    else if (p && p[0] === 'late') rec[st.id] = { status: 'present', late: true, in: minsAgo(p[1] + 60) };
    else if (st.shift === 'Night') rec[st.id] = i % 2 ? { status: 'out', in: minsAgo(900), out: minsAgo(300) } : { status: 'expected' };
    else rec[st.id] = { status: 'present', in: minsAgo(120 + (i * 7) % 60) };
  });
  S.att = { date: dayKey(), rec };
}
function ensureAttendance() {
  if (!S.att || S.att.date !== dayKey()) { seedAttendance(); save(); }
}
function attOf(sid) { return (S.att && S.att.rec[sid]) || { status: 'expected' }; }
function attStatus(sid) { const r = attOf(sid); return r.status === 'present' && r.late ? 'late' : r.status; }
function myStaff() { return me && me.sid ? S.staff.find(x => x.id === me.sid) : null; }
function canEditAtt(sid) { return me.role === 'admin' || me.role === 'reception' || me.sid === sid; }
function lateNow(shift) {
  const d = new Date(), m = d.getHours() * 60 + d.getMinutes();
  return shift === 'Night' ? (m > 20 * 60 + 15 || m < 8 * 60) : (m > 8 * 60 + 15 && m < 20 * 60);
}
function setAtt(sid, status) {
  const st = S.staff.find(x => x.id === sid);
  const r = Object.assign({}, attOf(sid));
  if (status === 'present') { r.status = 'present'; r.in = nowISO(); r.out = null; r.late = lateNow(st.shift); }
  else if (status === 'out') { r.status = 'out'; r.out = nowISO(); }
  else { S.att.rec[sid] = { status }; save(); closeModal(); render(); toast(`${st.name}: ${STATUS_LABEL[status].toLowerCase()}`); return; }
  S.att.rec[sid] = r; save(); closeModal(); render();
  toast(status === 'present' ? `${st.name} checked in${r.late ? ' (late)' : ''}` : `${st.name} checked out`);
}
function staffSheet(sid) {
  const st = S.staff.find(x => x.id === sid); const r = attOf(sid); const s = attStatus(sid);
  const opts = [];
  if (canEditAtt(sid)) {
    if (s !== 'present' && s !== 'late') opts.push(['enter', 'Check in now', `setAtt('${sid}','present')`, '']);
    if (s === 'present' || s === 'late') opts.push(['exit', 'Check out now', `setAtt('${sid}','out')`, '']);
    if (me.role === 'admin' || me.role === 'reception') {
      if (s !== 'absent') opts.push(['alert', 'Mark absent', `setAtt('${sid}','absent')`, 'danger']);
      if (s !== 'leave') opts.push(['calendar', 'Mark on leave', `setAtt('${sid}','leave')`, '']);
      if (s !== 'expected') opts.push(['reset', 'Reset to expected', `setAtt('${sid}','expected')`, '']);
    }
  }
  sheet(st.name, `<div class="acct"><span class="avatar">${initials(st.name)}</span><div><b>${esc(st.title)}</b><div class="small muted">${esc(tentLabel(st.tent))} · ${st.shift} shift</div><div class="small">${esc(attLine(sid))}</div></div></div>
    ${opts.length ? `<div class="sheetlist">${opts.map(o => `<button class="${o[3]}" onclick="${o[2]}">${ic(o[0])}${o[1]}</button>`).join('')}</div>` : '<p class="small muted">Only the registration desk and the site manager can change other staff members\' attendance.</p>'}`);
}
function attLine(sid) {
  const r = attOf(sid), s = attStatus(sid);
  if (s === 'present' || s === 'late') return `${STATUS_LABEL[s]} · in since ${fmtTime(r.in)}`;
  if (s === 'out') return `Checked out at ${fmtTime(r.out)}`;
  return STATUS_LABEL[s];
}
function setFollow(id, status) {
  const f = S.followups.find(x => x.id === id); const p = pat(f.pid);
  f.status = status; f.at = status === 'attended' ? nowISO() : null;
  log(p.id, status === 'attended' ? `Attended follow-up visit: ${f.reason}.` : `Missed follow-up visit: ${f.reason}.`);
  save(); render(); toast(`${p.name}: ${status === 'attended' ? 'attended' : 'marked as missed'}`);
}

function buildFeedback() {

function sendFeedback(e) {

function dashView() {

  const tile = (icon, n, l, cls) => `<div class="tile ${cls || ''}"><span class="tic">${ic(icon)}</span><div><div class="n">${n}</div><div class="l">${l}</div></div></div>`;
  const maxQ = Math.max(8, ...CLINICAL.map(id => active.filter(p => p.location === id).length));
  const rows = TENTS.filter(t => t.id !== 'REG').map(t => {

      ${tile('calendar', S.followups.filter(f => f.date === dayKey()).length, 'Follow-ups due today')}

        <div class="row small muted mt" style="gap:16px"><span class="legend"><i style="background:var(--accent)"></i>In care / admitted</span><span class="legend"><i style="background:#9ad9d8"></i>Waiting</span></div>

}
function saveIdentify(e, id) {
  e.preventDefault();

  if (!formGate(f, errs, warns)) return;

  p.phone = $('#id-phone').value.trim() || p.phone; p.shelter = $('#id-shelter').value.trim() || p.shelter;
  log(id, `Identified as ${name} (was ${p.tempId}). Recorded by ${me.name}.`);
  done('Patient identified');
}

/* ---------- validation ---------- */

function checkVitals(v) {
  const E = [], Wn = [];
  const num = (val, name, lo, hi, wlo, whi, unit) => {
    if (val === '' || val == null) return;
    const n = Number(val);
    if (!isFinite(n)) { E.push(`${name} must be a number.`); return; }
    if (n < lo || n > hi) { E.push(`${name} ${val}${unit} is not possible. Allowed range: ${lo} to ${hi}${unit}.`); return; }
    if ((wlo != null && n < wlo) || (whi != null && n > whi)) Wn.push(`${name} ${val}${unit} is unusual.`);
  };
  if (v.bp) {
    const m = /^(\d{2,3})\s*\/\s*(\d{2,3})$/.exec(v.bp);
    if (!m) E.push('BP must be written like 120/80.');
    else {
      const sy = +m[1], di = +m[2];
      if (sy < 50 || sy > 260 || di < 20 || di > 160 || di >= sy) E.push(`BP ${v.bp} is not possible.`);
      else if (sy < 80 || sy > 200 || di > 120) Wn.push(`BP ${v.bp} is unusual.`);
    }
  }
  num(v.hr, 'Pulse', 20, 250, 40, 180, ' bpm');
  num(v.temp, 'Temperature', 30, 45, 35, 40.5, ' °C');
  num(v.spo2, 'SpO₂', 30, 100, 85, null, '%');
  num(v.rr, 'Resp. rate', 4, 80, 8, 40, '/min');
  num(v.height, 'Height', 30, 250, null, null, ' cm');
  num(v.weight, 'Weight', 0.5, 300, null, null, ' kg');
  num(v.muac, 'MUAC', 5, 50, null, null, ' cm');
  return { E, Wn };
}
// Shows errors or warnings in the form. Returns true when it is safe to save.
function formGate(form, errors, warnings) {
  const box = form.querySelector('.form-msg');
  if (errors.length) {
    form.dataset.warned = '';
    box.innerHTML = `<div class="err-box" role="alert">${errors.map(esc).join('<br>')}</div>`;
    box.scrollIntoView({ block: 'nearest' });
    return false;
  }
  if (warnings.length && form.dataset.warned !== '1') {
    form.dataset.warned = '1';
    box.innerHTML = `<div class="warn-box" role="alert">${warnings.map(esc).join('<br>')}<br><b>Please re-check. Press the button again to save anyway.</b></div>`;
    box.scrollIntoView({ block: 'nearest' });
    return false;
  }
  box.innerHTML = '';
  return true;
}
function allergyField(cur) {
  const st = cur ? cur.allergyStatus : '';
  const opt = (v, id, label) => `<input type="radio" name="allst" id="${id}" value="${v}" ${st === v ? 'checked' : ''} ${id === 'al-u' ? 'required' : ''} onchange="allergyToggle()"><label for="${id}">${label}</label>`;
  return `<div class="field"><label>Allergies</label><div class="choice">${opt('unknown', 'al-u', 'Unknown / not asked yet')}${opt('none', 'al-n', 'Asked: no known allergies')}${opt('known', 'al-k', 'Has allergy')}</div>
    <input id="r-all" type="text" placeholder="Which allergy? e.g. Penicillin" value="${esc(cur && cur.allergyStatus === 'known' ? cur.allergies : '')}" style="margin-top:8px;${st === 'known' ? '' : 'display:none'}"></div>`;
}
function allergyToggle() {
  const k = $('#al-k'), box = $('#r-all');
  if (!box) return;
  box.style.display = k && k.checked ? '' : 'none';
  box.required = !!(k && k.checked);
}
function readAllergy(form) {
  const st = form.allst ? form.allst.value : '';

  const err = !st ? 'Choose an allergy option.' : (st === 'known' && !txt ? 'Write which allergy the patient has.' : '');
  return { st, txt, err };
}
function vitalsFields(v) {

    <div class="field"><label for="v-avpu">Consciousness</label><select id="v-avpu"><option value="">—</option>${ACVPU.map(x => `<option ${v.avpu === x ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
    <div class="field"><label class="checkline" style="margin-top:26px"><input type="checkbox" id="v-o2" ${v.o2 ? 'checked' : ''}> On oxygen</label></div>

}
function triageFields(cur, withDoa) {
  const opts = [['red', 'Red · immediate', 'r'], ['yellow', 'Yellow · urgent', 'y'], ['green', 'Green · non-urgent', 'g']].concat(withDoa ? [['black', 'Dead on arrival', 'k']] : []);
  return opts.map(([t, l, c], i) =>
    `<input type="radio" name="triage" id="t-${t}" value="${t}" ${cur === t ? 'checked' : ''} ${i === 0 ? 'required' : ''}><label for="t-${t}" class="${c}">${l}</label>`).join('');
}
function criteriaFields() {
  const grp = (list, pre) => list.map(([g, items]) => `<h4>${g}</h4>` + items.map(t => {
    const i = (pre === 'rs' ? RED_LIST : TRAUMA_LIST).indexOf(t);
    return `<label><input type="checkbox" id="${pre}${i}" onchange="triageHint()">${esc(t)}</label>`;
  }).join('')).join('');
  return `<details class="crit" id="crit"><summary>Triage criteria · WHO Emergency Care Toolkit <span class="cnt" id="crit-n">None ticked</span></summary>
    <div class="critcols checks">
      <div><h3>High-risk red signs</h3><p class="small muted" style="margin:2px 0 0">Any one means Red.</p>${grp(RED_SIGNS, 'rs')}</div>
      <div><h3>High-risk trauma</h3><p class="small muted" style="margin:2px 0 0">Any one means at least Yellow, and a doctor sees the patient early.</p>${grp(TRAUMA_SIGNS, 'ht')}</div>
    </div></details>
    <div class="tri-hint" id="tri-hint"></div>`;
}
function readCriteria() {
  const red = RED_LIST.filter((_, i) => $('#rs' + i) && $('#rs' + i).checked);
  const trauma = TRAUMA_LIST.filter((_, i) => $('#ht' + i) && $('#ht' + i).checked);
  return { red, trauma, suggested: red.length ? 'red' : trauma.length ? 'yellow' : '' };
}
// Ticks the pulse sign from the vital signs, then shows what the criteria suggest.
function triageHint() {
  if (!$('#crit')) return;
  const age = Number($('#r-age') ? $('#r-age').value : ''), hr = Number($('#v-hr') ? $('#v-hr').value : '');
  const pulseBox = $('#rs' + RED_LIST.indexOf('Adult: pulse under 50 or over 150'));
  if (age >= 18 && hr && (hr < 50 || hr > 150) && !pulseBox.checked) { pulseBox.checked = true; pulseBox.dataset.auto = '1'; }
  const c = readCriteria(), n = c.red.length + c.trauma.length;
  $('#crit-n').textContent = n ? n + ' ticked' : 'None ticked';
  const h = $('#tri-hint');
  h.className = 'tri-hint ' + c.suggested;
  h.textContent = c.suggested === 'red' ? `Criteria suggest RED: ${c.red.join('; ')}.` : c.suggested === 'yellow' ? `Criteria suggest at least YELLOW (high-risk trauma): ${c.trauma.join('; ')}.` : '';
  if (n) $('#crit').open = true;
}
const critText = p => { const c = p.triageCriteria; if (!c) return ''; return [c.red.length ? 'Red signs: ' + c.red.join('; ') : '', c.trauma.length ? 'High-risk trauma: ' + c.trauma.join('; ') : ''].filter(Boolean).join(' · '); };

function readVitals() {
  const g = id => { const el = $(id); return el ? el.value.trim() : ''; };
  return { bp: g('#v-bp'), hr: g('#v-hr'), temp: g('#v-temp'), spo2: g('#v-spo2'), rr: g('#v-rr'), height: g('#v-height'), weight: g('#v-weight'), muac: g('#v-muac'), avpu: g('#v-avpu'), o2: !!($('#v-o2') && $('#v-o2').checked), oedema: !!($('#v-oed') && $('#v-oed').checked) };
}

let pendingReg = null;
function doRegister(e) {
  e.preventDefault();
  const f = e.target;
  const name = $('#r-name').value.trim(), age = $('#r-age').value, cc = $('#r-cc').value.trim();
  const al = readAllergy(f);
  const v = readVitals();
  const errs = [];
  if (!name) errs.push('Write the patient\'s full name.');
  if (age === '' || Number(age) < 0 || Number(age) > 120) errs.push('Write an age between 0 and 120.');
  if (!f.sex.value) errs.push('Choose the gender.');
  if (!cc) errs.push('Write the main complaint.');
  if (al.err) errs.push(al.err);
  if ($('#r-unacc').checked && Number(age) >= 18) errs.push('"Without a parent or caregiver" is for children under 18.');
  if (!f.triage.value) errs.push('Choose a triage colour. Nothing is selected by default.');
  const cv = checkVitals(v);
  const crit = readCriteria();
  const tri = f.triage.value;
  const under = tri && tri !== 'black' && crit.suggested && triOrder[tri] > triOrder[crit.suggested];
  const warns = cv.Wn.concat(under ? [`You chose ${TRI_NAME[tri]}, but the ticked criteria suggest ${crit.suggested === 'red' ? 'Red' : 'at least Yellow'}. Check the triage. If you keep it, the reason is your clinical judgement and it is recorded.`] : []);
  if (!formGate(f, errs.concat(cv.E), warns)) return;
  pendingReg = {
    name, age: Number(age), sex: f.sex.value === 'M' ? 'M' : 'F', pregnant: f.sex.value === 'FP',
    allergy: al, phone: $('#r-phone').value.trim(), shelter: $('#r-shelter').value.trim(),
    complaint: cc, triage: tri, vitals: v, location: f.dest.value, unaccompanied: $('#r-unacc').checked, carer: $('#r-unacc').checked ? '' : $('#r-carer').value.trim(),
    criteria: Object.assign(crit, { chosen: tri, override: !!under, by: me.name, at: nowISO() })
  };
  const matches = S.patients.filter(q => normName(q.name) === normName(name) && q.sex === pendingReg.sex && Math.abs(q.age - pendingReg.age) <= 1);
  if (matches.length) { dupeSheet(matches); return; }
  createPatient(pendingReg);
}

function dupeSheet(matches) {
  const rows = matches.map(q => `<div class="dupe"><div><b>${esc(q.name)}</b> <span class="small muted">${q.id}</span>
      <div class="small muted">${q.age} y · ${sexTxt(q)}${q.shelter ? ' · ' + esc(q.shelter) : ''} · ${q.state === 'discharged' ? 'Discharged · last visit ' + fmtDay(dayKey(new Date(q.movedAt))) : 'In the hospital now · ' + esc(tentLabel(q.location))}</div>
      <div class="small muted">Allergies: ${esc(allergyText(q))}</div></div>
      ${q.state === 'discharged'
        ? `<button class="btn primary sm" onclick="newVisitFromReg('${q.id}')">Same person: start a new visit</button>`
        : `<button class="btn sm" onclick="closeModal();go('patient','${q.id}')">Same person: open file</button>`}</div>`).join('');
  modal('Possible existing patient', `<p class="small">A patient with the same name, sex and a similar age is already registered. Check with the patient before going on. A similar name alone is not proof it is the same person.</p>
    ${rows}
    <button class="btn mt" onclick="closeModal();createPatient(pendingReg)">Different person: create a new file</button>`);
}
function createPatient(r) {
  const p = {
    id: nextId(), name: r.name, age: r.age, sex: r.sex, pregnant: r.pregnant,
    allergyStatus: r.allergy.st, allergies: r.allergy.st === 'known' ? r.allergy.txt : '',
    allergyBy: r.allergy.st === 'unknown' ? '' : me.name, allergyAt: r.allergy.st === 'unknown' ? '' : nowISO(),
    clinical: {}, outcomeDetail: {}, doctor: '', visitNo: 1, visits: [], dischargeApproved: null,
    phone: r.phone, shelter: r.shelter, complaint: r.complaint, triage: r.triage, vitals: r.vitals,
    location: r.location, state: 'waiting', bed: null, notes: [], outcome: null, createdAt: nowISO(), movedAt: nowISO(),
    triageCriteria: r.criteria || null, tempId: r.tempId || '', ageGroup: r.ageGroup || '', unidentified: !!r.tempId, mci: r.mci || '',
    features: r.features || '', unaccompanied: !!r.unaccompanied, carer: r.carer || '', obs: [], rx: [], mar: []
  };
  S.patients.push(p);
  if (p.triage !== 'black') recordObs(p, p.vitals || {}, 'Registration');
  if (p.unaccompanied) {
    raiseAlert({ type: 'protection', pid: p.id, level: 'medium', title: 'Child without a caregiver', text: 'Inform the child protection focal point. Keep the child in a safe, supervised place and record any family tracing.', roles: ['admin'] });
    log(p.id, 'Registered as a child without a parent or caregiver. Child protection focal point alerted.');
  }
  log(p.id, `Registered at Tent 1 (visit ${encId(p)})${p.tempId ? ' as ' + p.tempId + ' during a mass casualty incident' : ''}. Triage: ${TRI_NAME[p.triage]}.${critText(p) ? ' ' + critText(p) + '.' : ''}`);
  if (r.criteria && r.criteria.override) log(p.id, `Triage kept at ${TRI_NAME[p.triage]} against the criteria suggestion (${r.criteria.suggested === 'red' ? 'Red' : 'at least Yellow'}). Clinical judgement of ${me.name}.`);
  if (p.triage === 'black') {
    p.state = 'discharged'; p.outcome = 'Dead on arrival'; p.outcomeDetail = { visit: 'Dead on arrival' };
    log(p.id, 'Dead on arrival. Not sent to a tent.');
  } else log(p.id, `Referred to ${tentLabel(p.location)}.`);
  if (r.fast) { pendingReg = null; save(); render(); toast(`${p.tempId} registered · ${p.triage === 'black' ? 'dead on arrival' : tentLabel(p.location)}`); return; }
  pendingReg = null;
  save();
  view = { name: 'patient', id: p.id };
  closeModal();
  render();
  wristband(p.id);
}
function newVisitFromReg(pid) {
  const p = pat(pid), r = pendingReg;
  if (r.allergy.st !== 'unknown') setAllergy(p, r.allergy.st, r.allergy.txt, true);
  if (r.phone) p.phone = r.phone;
  if (r.shelter) p.shelter = r.shelter;
  p.pregnant = r.pregnant;
  startVisit(p, { complaint: r.complaint, triage: r.triage, vitals: r.vitals, location: r.location });
  p.triageCriteria = r.criteria || null;
  pendingReg = null;
  save();
  view = { name: 'patient', id: p.id };
  closeModal();
  render();
  wristband(p.id);
}
// Closes the old visit into the patient's history and opens a new one on the same file number.
function startVisit(p, v, fuId) {
  p.visits = p.visits || [];
  p.visits.push({ enc: encId(p), start: p.createdAt, end: p.movedAt, complaint: p.complaint, triage: p.triage,
    dx: (p.clinical && p.clinical.dx) || '', outcome: p.outcome || '', doctor: p.doctor || '', meds: (p.outcomeDetail && p.outcomeDetail.meds) || '' });
  p.visitNo = (p.visitNo || 1) + 1;
  Object.assign(p, { complaint: v.complaint, triage: v.triage, vitals: v.vitals, location: v.location, state: 'waiting', bed: null,
    notes: [], clinical: {}, outcomeDetail: {}, outcome: null, doctor: '', dischargeApproved: null, createdAt: nowISO(), movedAt: nowISO() });
  const f = fuId ? S.followups.find(x => x.id === fuId) : null;
  if (f) { f.status = 'attended'; f.at = nowISO(); f.enc = encId(p); }
  log(p.id, `New visit ${encId(p)} opened on the same file${f ? ' for the follow-up: ' + f.reason : ''}. Triage: ${v.triage}. Sent to ${tentLabel(v.location)}.`);
}
function newVisitForm(pid, fuId) {
  const p = pat(pid);
  const f = fuId ? S.followups.find(x => x.id === fuId) : null;
  const dest = CLINICAL.map((id, i) => `<input type="radio" name="dest" id="nd-${id}" value="${id}" ${i === 0 ? 'checked' : ''}><label for="nd-${id}">Tent ${tent(id).no} · ${tent(id).name}</label>`).join('');
  modal('Start a new visit', `<form onsubmit="saveNewVisit(event,'${pid}','${fuId || ''}')" oninput="this.dataset.warned=''" novalidate>
    <p class="small"><b>${esc(p.name)}</b> · ${p.id} · next visit ${p.id}-V${(p.visitNo || 1) + 1}<br><span class="muted">Allergies on file: ${esc(allergyText(p))}. Update them from the file if they changed.</span></p>
    <div class="field"><label for="nv-cc">Reason for this visit</label><input id="nv-cc" type="text" required value="${esc(f ? f.reason : '')}"></div>
    <div class="field"><label>Triage</label><div class="choice tri-pick">${triageFields('')}</div></div>
    ${vitalsFields()}
    <div class="field"><label>Send to</label><div class="choice">${dest}</div></div>
    <div class="form-msg"></div>
    <button class="btn primary">Start visit</button></form>`);
}
function saveNewVisit(e, pid, fuId) {
  e.preventDefault();
  const f = e.target, p = pat(pid);
  const cc = $('#nv-cc').value.trim(), v = readVitals();
  const errs = [];
  if (!cc) errs.push('Write the reason for this visit.');
  if (!f.triage.value) errs.push('Choose a triage colour.');
  const cv = checkVitals(v);
  if (!formGate(f, errs.concat(cv.E), cv.Wn)) return;
  startVisit(p, { complaint: cc, triage: f.triage.value, vitals: v, location: f.dest.value }, fuId || null);

function saveNote(e, id) {
  e.preventDefault();
  const p = pat(id);
  const g = k => $(k).value.trim();
  const old = p.clinical || {};
  const why = $('#n-why') ? $('#n-why').value.trim() : '';
  const draft = { history: g('#n-hist'), system: g('#n-sys'), exam: g('#n-exam'), dx: g('#n-dx'), category: g('#n-cat'), procedures: g('#n-proc'), srh: g('#n-srh'), response: g('#n-resp'), poc: g('#n-poc'), transfusion: $('#n-tx').checked, icd: $('#n-icd') ? icdCode($('#n-icd').value) : old.icd };
  const changes = old.dx ? changedFields(old, draft) : [];
  if (old.dx && changes.length && !why) { formGate(e.target, ['Write the reason for the change. The earlier version stays in the record history.'], []); return; }
  if (old.dx && changes.length) { p.clinicalHist = p.clinicalHist || []; p.clinicalHist.push(old); audit('Amended assessment', changes.map(x => x[1]).join(', ') + ' · ' + why, id); }
  p.clinical = { history: g('#n-hist'), system: g('#n-sys'), exam: g('#n-exam'), dx: g('#n-dx'), category: g('#n-cat'), procedures: g('#n-proc'), srh: g('#n-srh'), response: g('#n-resp'), poc: g('#n-poc'), transfusion: $('#n-tx').checked,
    mds: [...document.querySelectorAll('input[name=mds]:checked')].map(x => Number(x.value)), mdsCtx: Number((document.querySelector('input[name=mdsctx]:checked') || {}).value) || null,
    icd: draft.icd || '', at: nowISO(), by: me.name, amendReason: old.dx && changes.length ? why : '' };
  p.notes.push({ t: nowISO(), by: me.name, tent: p.location, dx: p.clinical.dx, plan: g('#n-plan') });
  if (p.state === 'waiting') p.state = 'in-care';
  if (me.role === 'doctor' || me.role === 'admin') p.seenAt = p.seenAt || nowISO();
  if (!p.doctor && (me.role === 'doctor' || me.role === 'admin')) p.doctor = me.name;
  ewarnCheck(p);
  log(id, old.dx && changes.length ? `Assessment amended (${changes.map(x => x[1].toLowerCase()).join(', ')}): ${why}.` : `Assessment: ${p.clinical.dx} (${p.clinical.category}).`);
  done('Assessment saved');
}

function saveSurvey(e, id) {
  e.preventDefault();
  const f = e.target, p = pat(id), g = k => $(k).value.trim(), r = n => f[n] ? f[n].value : '';
  const ok = k => $('#' + k + '-ok').checked;
  const S0 = {
    A: { normal: ok('A'), find: readCbs('af', PS.aFind), obs: readCbs('ao', PS.aObs), int: readCbs('ai', PS.aInt), spine: r('spine') },
    B: { normal: ok('B'), rr: g('#b-rr'), rise: readCbs('br', PS.bRise), trachea: r('trach'), sounds: g('#b-snd'), o2: g('#b-o2'), dev: g('#b-dev'), tube: readCbs('bt', ['Left', 'Right']) },
    C: { normal: ok('C'), signs: readCbs('cs', ['Cyanosis', 'Weak pulses', 'Asymmetric pulses', 'Raised JVP', 'Unstable pelvis']), skin: readCbs('ck', PS.skin), cr: g('#c-cr'), bleed: readCbs('cb', PS.bleed), access: readCbs('ca', PS.access), fluids: g('#c-fl'), ftype: g('#c-ft'), blood: r('blood'), pelvis: r('pelv') },
    D: { normal: ok('D'), avpu: r('avpu'), gcs: { e: g('#g-e'), v: g('#g-v'), m: g('#g-m') }, moves: readCbs('dm', PS.limbs), pl: g('#d-pl'), pr: g('#d-pr'), react: readCbs('dr', ['Left reactive', 'Right reactive']), glucose: g('#d-glu'), int: readCbs('di', PS.dInt) },
    E: { normal: ok('E'), exposed: $('#e-exp').checked, find: g('#e-f') },
    F: { status: r('fast'), abd: r('fper'), chest: readCbs('fc', ['Pneumothorax', 'Pleural fluid', 'Pericardial effusion']) },
    mech: g('#m-mech'), intent: g('#m-int')
  };
  const filled = k => Object.entries(S0[k]).some(([kk, v]) => kk !== 'normal' && (Array.isArray(v) ? v.length : typeof v === 'object' ? Object.values(v).some(Boolean) : v));
  const findingsFilled = { A: S0.A.find.length || S0.A.obs.length, B: S0.B.rise.length || S0.B.sounds || (S0.B.trachea && S0.B.trachea !== 'Midline'), C: S0.C.signs.length || S0.C.bleed.length || S0.C.blood, D: (S0.D.avpu && S0.D.avpu !== 'Alert') || S0.D.int.length };
  const errs = [], warns = [];
  ['A', 'B', 'C', 'D', 'E'].forEach(k => { if (!S0[k].normal && !filled(k)) errs.push(`${k}: tick Normal or record a finding.`); });
  ['A', 'B', 'C', 'D'].forEach(k => { if (S0[k].normal && findingsFilled[k]) errs.push(`${k} is ticked Normal but has abnormal findings. Untick Normal or clear the findings.`); });
  const gc = S0.D.gcs, gParts = [gc.e, gc.v, gc.m].filter(Boolean).length;
  if (gParts && gParts < 3) errs.push('GCS: fill all three parts (E, V and M) or leave all empty.');

  const rr = Number(S0.B.rr);
  if (S0.B.rr && (rr < 0 || rr > 80)) errs.push('Respiratory rate must be between 0 and 80.');
  const t = gcsTotal(gc);
  if (t && t <= 8) warns.push(`GCS ${t}: the patient may not protect the airway. Consider airway protection and a senior review.`);

// NEWS2: Royal College of Physicians, 2017. Adults 16 and over, SpO2 scale 1.

  low: 'Nurse to assess the patient. Observations at least every 4–6 hours.',
  lowmed: 'One sign scores 3. Urgent review by the ward doctor. Observations at least every hour.',
  medium: 'Urgent review by a doctor with acute care skills. Observations at least every hour.',
  high: 'Emergency assessment by a senior doctor or critical care team. Continuous monitoring.'

const EWS_DUE_H = { none: 12, low: 4, lowmed: 1, medium: 1, high: 0.25 };

  [5, { rr: [25, 30], hr: [95, 140], sbp: [80, 100] }],
  [12, { rr: [20, 25], hr: [80, 120], sbp: [90, 110] }],

function rxWarnings(p, drug, mg, route) {

  if (hasAllergy(p) && /sulfa|sulpha/.test(p.allergies.toLowerCase()) && /cotrimoxazole|sulfamethoxazole/.test(nm)) W.push('The patient is allergic to sulfa drugs.');
  if (p.allergyStatus === 'unknown') W.push('Allergies are not known yet. Ask the patient or family.');
  if (f && mg != null) {
    const wt = nz((p.vitals || {}).weight);
    if (isChild(p) && f[2] && wt) {
      const hi = Math.min(f[2][1] * wt, f[3] || Infinity);
      if (mg > hi * 1.1) W.push(`${fmtNum(mg)} mg is above the child dose for ${fmtNum(wt)} kg (up to ${fmtNum(hi)} mg). Check the dose.`);
    } else if (!isChild(p) && f[1] && mg > f[1]) W.push(`${fmtNum(mg)} mg is above the usual adult maximum of ${fmtNum(f[1])} mg a dose.`);
  }
  if (p.pregnant && nm === 'ibuprofen') W.push('Avoid ibuprofen in pregnancy, especially after 20 weeks. Paracetamol is preferred.');
  const others = activeRx(p).map(r => r.drug.toLowerCase()).concat((p.mar || []).filter(m => m.kind === 'med' && Date.now() - new Date(m.at) < 86400000).map(m => m.name.toLowerCase()));

  });

/* ---------- pharmacy stock ---------- */
function stockFor(drug, route) {
  const nm = (drug || '').toLowerCase();
  const items = (S.stock || []).filter(s => s.name.toLowerCase() === nm);
  return items.find(s => !route || s.routes.includes(route)) || items[0] || null;
}
// How many packs (tablets, vials, ampoules) one dose uses.
function unitsNeeded(dose, it) {
  const m = /([\d.]+)\s*(mg|g|mcg|ml|units?|iu)?/i.exec(dose || '');
  if (!m || !it.strength) return 1;
  const n = Number(m[1]);
  let u = (m[2] || it.sunit).toLowerCase(); if (u === 'unit' || u === 'iu') u = 'units';
  const su = it.sunit.toLowerCase(), mass = x => ({ g: 1000, mg: 1, mcg: 0.001 })[x];
  const ratio = mass(u) && mass(su) ? n * mass(u) / (it.strength * mass(su)) : u === su ? n / it.strength : null;
  return ratio ? Math.max(1, Math.ceil(ratio - 1e-9)) : 1;
}
function useStock(drug, route, dose) {
  const it = stockFor(drug, route); if (!it) return;
  const units = unitsNeeded(dose, it);
  it.qty = Math.max(0, it.qty - units);
  S.stockLog = S.stockLog || [];
  S.stockLog.unshift({ at: nowISO(), by: me ? me.name : '', item: it.id, change: -units, reason: 'Given to patient' });
  if (it.qty < it.min && !it.alerted) {
    it.alerted = true;
    raiseAlert({ type: 'stock', level: it.qty === 0 ? 'high' : 'medium', item: it.id, title: `${it.name} ${it.form}: ${it.qty} left`, text: `Below the minimum of ${it.min}. Order more from the supply chain.`, roles: ['admin'] });
  }
}

function photoPick(id) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.setAttribute('capture', 'environment');
  inp.onchange = () => {
    const file = inp.files[0]; if (!file) return;
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 240 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const p = pat(id); p.photo = c.toDataURL('image/jpeg', 0.7); URL.revokeObjectURL(url);
      log(id, 'Photo added to help identify the patient.'); audit('Added photo', '', id);
      done('Photo saved');
    };
    img.src = url;
  };
  inp.click();
}

// Suggested MDS health event for an ICD-10 code (doctors can change it).
function icdToMds(code) {
  if (!code) return null;
  const c = code.toUpperCase(), L = c[0], n = parseFloat(c.slice(1));
  if (c.startsWith('A00') || c === 'A09' || c === 'E86') return 10;
  if (c.startsWith('A03') || c.startsWith('A06')) return 11;
  if (c.startsWith('B19') || c.startsWith('B15')) return 12;
  if (c.startsWith('B05')) return 13;
  if (c.startsWith('A39') || c.startsWith('G03')) return 14;
  if (c.startsWith('A35') || c.startsWith('A33') || c.startsWith('A34')) return 15;
  if (c.startsWith('A80')) return 16;
  if (c.startsWith('A9')) return 17;
  if (c.startsWith('R50')) return 18;
  if (L === 'J') return n <= 22 ? 9 : 20;
  if (L === 'L' || c.startsWith('B86') || c.startsWith('B01')) return 21;
  if (L === 'F') return 22;
  if (L === 'O') return c.startsWith('O80') || c.startsWith('O82') ? null : 23;
  if (c.startsWith('E4')) return 24;
  if (L === 'K' || L === 'N') return 19;
  if (L === 'I' || c.startsWith('E1') || c.startsWith('D64') || c.startsWith('R56') || c.startsWith('G40') || c.startsWith('T78') || c.startsWith('T65')) return 20;
  if (c.startsWith('S06') || c.startsWith('S12') || c.startsWith('S09')) return 4;
  if (c.startsWith('S2') || c.startsWith('S3') || c.startsWith('T79')) return 5;
  if (c.startsWith('S4') || c.startsWith('S5') || c.startsWith('S6') || c.startsWith('S7') || c.startsWith('S8')) return 6;
  if (c.startsWith('T3') || L === 'S' || L === 'T') return 7;

}

/* ---------- disease alerts (EWARN) ---------- */
const EWARN = { 10: 'Acute watery diarrhoea (cholera?)', 11: 'Acute bloody diarrhoea', 13: 'Measles', 14: 'Meningitis', 15: 'Tetanus', 16: 'Acute flaccid paralysis', 17: 'Haemorrhagic fever' };
function ewarnCheck(p) {
  const c = p.clinical || {}, items = (c.mds || []).slice();
  if (c.icd && c.icd.startsWith('A00')) items.push(10);
  const hits = items.filter(n => EWARN[n] && (n !== 10 || (c.icd || '').startsWith('A00')));
  hits.forEach(n => {
    if ((S.alerts || []).some(a => a.type === 'ewarn' && a.pid === p.id && a.item === n)) return;
    raiseAlert({ type: 'ewarn', pid: p.id, item: n, level: 'high', title: `Suspected ${EWARN[n].toLowerCase()}: report within 24 hours`, text: 'Notify the Ministry of Health and WHO through the early warning system (EWARN). Isolate the patient and use infection prevention measures. Take samples if the protocol asks for them.', roles: ['admin', 'doctor'] });
    p.isolation = true;
    log(p.id, `Suspected ${EWARN[n].toLowerCase()}. Disease alert sent to the site manager for reporting. Patient to be isolated.`);
  });
}
const ewarnOnDay = day => (S.alerts || []).some(a => a.type === 'ewarn' && dayKey(new Date(a.at)) === day);

/* ---------- nutrition ---------- */
function nutrition(p, v) {
  v = v || p.vitals || {};
  const muac = nz(v.muac), months = p.ageGroup === 'Infant' ? 6 : Number(p.age) * 12;
  if (v.oedema && isChild(p)) return { level: 'sam', text: 'Severe acute malnutrition (bilateral pitting oedema)', action: 'Refer to the stabilisation centre (inpatient care). Check for medical complications.' };
  if (muac != null && months >= 6 && months < 60) {
    if (muac < 11.5) return { level: 'sam', text: `Severe acute malnutrition (MUAC ${muac} cm, under 11.5)`, action: 'Check appetite and complications. With complications: stabilisation centre. Without: outpatient therapeutic programme (OTP).' };
    if (muac < 12.5) return { level: 'mam', text: `Moderate acute malnutrition (MUAC ${muac} cm, 11.5 to 12.4)`, action: 'Refer to the targeted supplementary feeding programme (TSFP).' };
    return null;
  }
  if (muac != null && p.pregnant && muac < 23) return { level: 'mam', text: `Pregnant woman at nutritional risk (MUAC ${muac} cm, under 23)`, action: 'Refer to the supplementary feeding programme. Check the national cut-off.' };
  return null;
}

/* ---------- theatre: WHO Surgical Safety Checklist ---------- */

function saveSsc(e, id, sid, phase) {

/* ---------- labour (partograph) and delivery ---------- */
function labourCard(p, canEdit) {
  const L = p.labour; if (!L || !L.entries.length) return '';
  const es = L.entries.slice().sort((a, b) => a.at.localeCompare(b.at));
  const act = es.find(x => x.cx >= 4) || es[0];
  const t0 = new Date(act.at).getTime(), hrs = t => (new Date(t).getTime() - t0) / 3600000;
  const W = 520, H = 230, X = h => 40 + h * (W - 60) / 12, Y = cm => 14 + (10 - cm) * (H - 40) / 6;
  const alertEnd = Math.max(0, 10 - act.cx);
  const flag = partoFlags(p);
  const pts = es.filter(x => x.cx >= 4).map(x => [X(Math.max(0, hrs(x.at))), Y(x.cx)]);
  const svg = `<svg viewBox="0 0 ${W} ${H}" class="parto" role="img" aria-label="Partograph: cervical dilatation over time">
    ${[4, 5, 6, 7, 8, 9, 10].map(c => `<line x1="40" x2="${W - 20}" y1="${Y(c)}" y2="${Y(c)}" class="g"/><text x="30" y="${Y(c) + 4}" class="l">${c}</text>`).join('')}
    ${[0, 2, 4, 6, 8, 10, 12].map(h => `<line x1="${X(h)}" x2="${X(h)}" y1="${Y(10)}" y2="${Y(4)}" class="g"/><text x="${X(h)}" y="${H - 8}" class="l" text-anchor="middle">${h} h</text>`).join('')}
    <line x1="${X(0)}" y1="${Y(act.cx)}" x2="${X(alertEnd)}" y2="${Y(10)}" class="alertl"/><text x="${X(alertEnd) + 4}" y="${Y(10) + 12}" class="l al">Alert</text>
    <line x1="${X(4)}" y1="${Y(act.cx)}" x2="${X(4 + alertEnd)}" y2="${Y(10)}" class="actionl"/><text x="${X(4 + alertEnd) + 4}" y="${Y(10) + 12}" class="l ac">Action</text>
    <polyline points="${pts.map(q => q.join(',')).join(' ')}" class="cx"/>${pts.map(q => `<circle cx="${q[0]}" cy="${q[1]}" r="4" class="cxp"/>`).join('')}
    <text x="6" y="${Y(7)}" class="l" transform="rotate(-90 10 ${Y(7)})" text-anchor="middle">Cervix (cm)</text></svg>`;
  const last = es[es.length - 1];
  return `<div class="card" id="sec-lab"><div class="secthead">${ic('heart')}<h2>Labour · partograph</h2>${flag.level ? `<span class="badge ${flag.level === 'action' ? 'allergy' : 'warn'}" style="margin-left:auto">${flag.level === 'action' ? 'Action line crossed' : 'Alert line crossed'}</span>` : ''}</div>
    ${flag.msgs.length ? `<div class="warn-box">${flag.msgs.map(esc).join('<br>')}</div>` : ''}
    <div class="obswrap">${svg}</div>
    <div class="obswrap"><table class="obs"><thead><tr><th>Time</th><th>Cervix</th><th>Baby's heart</th><th>Contractions /10 min</th><th>BP</th><th>Pulse</th><th>Liquor</th></tr></thead><tbody>
      ${es.slice().reverse().map(x => `<tr><td class="t">${fmtTime(x.at)}</td><td>${x.cx} cm</td><td class="${x.fhr && (x.fhr < 110 || x.fhr > 160) ? 's3' : ''}">${esc(x.fhr || '–')}</td><td>${esc(x.contr || '–')}</td><td class="${sbpOf(x.bp) >= 140 ? 's2' : ''}">${esc(x.bp || '–')}</td><td>${esc(x.pulse || '–')}</td><td class="${x.liquor === 'Meconium' || x.liquor === 'Blood-stained' ? 's2' : ''}">${esc(x.liquor || '–')}</td></tr>`).join('')}</tbody></table></div>
    <p class="small muted" style="margin:6px 0 0">Modified WHO partograph: active labour from 4 cm. Alert line 1 cm per hour, action line 4 hours to the right. Last entry ${fmtTime(last.at)} by ${esc(last.by)}.</p>
    ${canEdit && !p.delivery ? `<div class="row mt" style="gap:8px"><button class="btn" onclick="labourForm('${p.id}')">${ic('pulse')}Add labour check</button><button class="btn primary" onclick="deliveryForm('${p.id}')">${ic('heart')}Record delivery</button></div>` : ''}</div>`;
}
function partoFlags(p) {
  const L = p.labour, msgs = []; let level = '';
  if (!L || !L.entries.length) return { msgs, level };
  const es = L.entries.slice().sort((a, b) => a.at.localeCompare(b.at)), act = es.find(x => x.cx >= 4);
  if (act) {
    const t0 = new Date(act.at).getTime();
    es.filter(x => x.cx >= 4).forEach(x => {
      const h = (new Date(x.at).getTime() - t0) / 3600000, expected = act.cx + h;
      if (x.cx < expected - 4 + 0.001 && h >= 4) level = 'action';
      else if (x.cx < expected - 0.25 && level !== 'action') level = 'alert';
    });
  }
  if (level === 'action') msgs.push('Labour has crossed the action line. Senior review now: assess for obstructed labour and decide on intervention.');
  else if (level === 'alert') msgs.push('Labour is slower than 1 cm per hour (right of the alert line). Review, and consider referral or augmentation according to the protocol.');
  const last = es[es.length - 1];
  if (last.fhr && (last.fhr < 110 || last.fhr > 160)) msgs.push(`Baby's heart rate ${last.fhr}/min is outside 110–160. Change the mother's position, check again, and call the doctor.`);
  if (sbpOf(last.bp) >= 140) msgs.push(`Blood pressure ${last.bp}: check for pre-eclampsia (protein in urine, headache, vision).`);
  if (last.liquor === 'Meconium') msgs.push('Meconium in the liquor: prepare for newborn resuscitation.');
  return { msgs, level };
}

const CRC_T = (() => { const t = []; for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_T[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

    parts.push(new Uint8Array([...u32(0x04034b50), ...head]), nm, data);
    central.push(new Uint8Array([...u32(0x02014b50), ...u16(20), ...head, ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(off)]), nm);
    off += 30 + nm.length + data.length;
  });

  const end = new Uint8Array([...u32(0x06054b50), ...u16(0), ...u16(0), ...u16(files.length), ...u16(files.length), ...u32(csize), ...u32(off), ...u16(0)]);

}

/* ---------- render ---------- */
function render() {
  const app = $('#app');
  if (!me) { document.body.classList.remove('has-actionbar', 'no-nav'); app.innerHTML = loginView(); return; }
  let inner = '';
  switch (view.name) {
    case 'dash': inner = dashView(); break;
    case 'register': inner = registerView(); break;
    case 'today': inner = todayView(); break;
    case 'tent': inner = tentView(view.id); break;
    case 'orders': inner = ordersView(); break;
    case 'ward': inner = wardView(); break;
    case 'search': inner = searchView(); break;
    case 'attend': inner = attendView(); break;
    case 'mds': inner = mdsView(); break;
    case 'pharmacy': inner = pharmacyView(); break;
    case 'indicators': inner = indicatorsView(); break;
    case 'audit': inner = auditView(); break;
    case 'patient': inner = patientView(view.id); break;
    default: view = homeFor(me.role); return render();
  }
  app.innerHTML = shell(inner);
  document.body.classList.toggle('has-actionbar', view.name === 'patient');
  if (view.name === 'search') doSearch();
}

function updateNet() {
  const el = $('#net');
  if (!el) return;
  el.className = 'pill ' + (navigator.onLine ? 'on' : 'off');
  el.innerHTML = '<span class="dot"></span><span class="ptxt">' + (navigator.onLine ? 'Online' : 'Offline · saved on device') + '</span>';
}

window.addEventListener('online', updateNet);
window.addEventListener('offline', updateNet);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

ensureAttendance();
const savedUser = read(USER_KEY);
if (savedUser && USERS[savedUser]) { me = Object.assign({ username: savedUser }, USERS[savedUser]); view = homeFor(me.role); }

setInterval(() => { if (me && !$('#modal-root').innerHTML && view.name !== 'register' && view.name !== 'search') render(); }, 60000);

  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
